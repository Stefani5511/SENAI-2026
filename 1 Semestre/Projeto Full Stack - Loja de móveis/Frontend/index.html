<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja de Móveis</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>Loja de Móveis</h1>

<button onclick="cadastro.classList.remove('oculto')">
Adicionar Móvel
</button>

</header>

<main id="produtos"></main>

<div id="cadastro" class="modal oculto">
<div class="janela">

<h2>Adicionar</h2>

<form id="formProduto">

<label>Nome</label>
<input type="text" id="nome" required>

<label>Preço</label>
<input type="number" id="preco" required>

<label>Categoria</label>
<input type="text" id="categoria" required>

<label>Marca</label>
<input type="text" id="marca" required>

<label>URL da imagem</label>
<input type="text" id="imagem" required>

<br><br>

<button type="reset" onclick="cadastro.classList.add('oculto')">
Cancelar
</button>

<button type="submit">
Salvar
</button>

</form>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
